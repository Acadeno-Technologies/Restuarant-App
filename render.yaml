# Render Blueprint configuration for T-Clock Restaurant POS
services:
  # 1. Django Backend Web Service
  - type: web
    name: restaurant-backend
    runtime: python
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn tclock.wsgi:application
    rootDir: backend
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_12xkWioluBmS@ep-empty-cloud-aeuoattr-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: CLOUDINARY_URL
        value: cloudinary://956282561925651:qJWJ9kuTrkT8Eh_7SwfW87-kPbU@tbz9jmnj
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. React Frontend Static Site
  - type: static
    name: restaurant-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://restuarant-app-q12p.onrender.com/api



